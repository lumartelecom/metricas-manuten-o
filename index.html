<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premiação de manutenção · Outubro/2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#5b6b86;--line:#d8dfeb;--navy:#14284b;--blue:#1f4a8b;--red:#bd2c1f;--ok:#0f7b4a;--okbg:#e2f5ea;--no:#b3261e;--nobg:#fde9e7;--inp:#fff;--sum:#fff6dd;--prop:#f0f5ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1426;--card:#121d35;--ink:#e6ecf8;--mut:#93a3c1;--line:#26365a;--navy:#0a1730;--blue:#6ea0f0;--ok:#4fd18b;--okbg:#10342a;--no:#ff8a80;--nobg:#3a1c1f;--inp:#0c1426;--sum:#2f2a12;--prop:#162442;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1426;--card:#121d35;--ink:#e6ecf8;--mut:#93a3c1;--line:#26365a;--navy:#0a1730;--blue:#6ea0f0;--ok:#4fd18b;--okbg:#10342a;--no:#ff8a80;--nobg:#3a1c1f;--inp:#0c1426;--sum:#2f2a12;--prop:#162442;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 'IBM Plex Sans',system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 18px;border-bottom:4px solid var(--red);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:18px;font-weight:600}
header p{margin:2px 0 0;color:#b9c6e0;font-size:12px}
.tot{text-align:right}
.tot b{display:block;font-size:24px;font-weight:700}
.tot span{font-size:11px;color:#b9c6e0}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;align-items:center}
.bar input,.bar button,.bar select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.bar button{cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.bar button:hover{border-color:var(--blue)}
.bar button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.bar button.pri:hover{opacity:.92}
.bar .grp{display:inline-flex;align-items:center;gap:6px;background:var(--card);padding:3px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--mut)}
.bar .grp input{width:54px;padding:3px 5px;text-align:center;font-weight:600}
.bar .sp{flex:1}
.leg{font-size:11.5px;color:var(--mut)}
.wrap{margin:0 18px 18px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap;vertical-align:middle}
thead th{position:sticky;background:var(--navy);color:#fff;font-weight:600;z-index:2;font-size:12px}
thead tr:nth-child(1) th{top:0}
thead tr:nth-child(2) th{top:31px;background:var(--card);color:var(--mut);font-weight:500;font-size:11px}
thead tr:nth-child(3) th{top:58px;background:var(--card);color:var(--ink);border-bottom:2px solid var(--blue)}
.nm{position:sticky;left:0;text-align:left;background:var(--card);z-index:1;min-width:175px;font-weight:600;padding-left:10px}
thead .nm{z-index:3}
thead tr:nth-child(1) .nm{background:var(--navy)}
.nm small{display:block;color:var(--mut);font-weight:400;font-size:10.5px}
.pv{width:64px;text-align:right;padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--inp);color:var(--ink);font:inherit;font-weight:600}
.mv{width:62px;text-align:center;padding:4px 4px;border:1px solid var(--line);border-radius:4px;background:var(--inp);color:inherit;font:inherit;font-weight:600}
.mv:hover,.mv:focus,.dv:hover,.dv:focus{border-color:var(--blue);outline:none}
.dv{width:52px;text-align:center;padding:4px 4px;border:1px solid var(--line);border-radius:4px;background:var(--inp);color:var(--ink);font:inherit;font-weight:600}
.prop-col{background:var(--prop)}
thead tr:nth-child(1) th.prop-col{background:#1b386b}
.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.no{background:var(--nobg);color:var(--no);font-weight:600}
.na{color:var(--mut)}
.sub-tot{font-weight:600;color:var(--mut);background:var(--card);min-width:88px}
.last{position:sticky;right:0;background:var(--sum);font-weight:700;min-width:105px;z-index:1;border-left:2px solid var(--red)}
thead .last{z-index:3}
thead tr:nth-child(1) .last{background:var(--red)}
tfoot td{position:sticky;bottom:0;background:var(--sum);font-weight:700;border-top:2px solid var(--red)}
tfoot .nm{background:var(--sum)}
.mn{cursor:pointer;color:var(--mut);user-select:none;min-width:68px}
.mn:hover{background:var(--bg)}
.mn:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.mn.ok{color:var(--ok);background:var(--okbg)}
.pct-badge{display:block;font-size:10px;color:var(--mut);font-weight:400;margin-top:1px}
/* Modo captura de foto para sair tudo limpo e sem cortes */
.capturing .bar{display:none!important}
.capturing .wrap{overflow:visible!important;max-height:none!important;margin:0 18px 18px!important;border:1px solid var(--line)!important}
.capturing th,.capturing td{position:static!important}
</style>
</head>
<body>
<div id="capture-area">
<header>
<div>
  <h1>Premiação de manutenção · Outubro/2026</h1>
  <p>Pontuação máxima de R$ 700,00 (Anexo I). Digite os indicadores, marque os critérios e ajuste os dias proporcionais.</p>
</div>
<div class="tot"><b id="gt">R$ 0,00</b><span>total líquido a pagar na equipe</span></div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Buscar técnico ou login" aria-label="Buscar técnico">
  <label class="grp" title="Total de dias base do mês para o cálculo proporcional">
    Dias base do mês:
    <input id="base-days" type="number" min="1" max="31" step="1" value="30">
  </label>
  <button id="all-ok" type="button" title="Marcar todos os critérios manuais como atingidos">✓ Marcar manuais</button>
  <button id="clr" type="button">↺ Restaurar padrão</button>
  <button id="thm" type="button">◐ Tema</button>
  <button id="shot" type="button" class="pri">📷 Baixar foto (PNG)</button>
  <span class="sp"></span>
  <span class="leg">Verde: pontua · Vermelho: não bateu meta · “—”: sem dado</span>
</div>
<div class="wrap"><table id="tb"></table></div>
</div>
<script>
const D={
  "ind": [
    {"n": "Produção", "m": null, "max": 80},
    {"n": "Revisita", "m": ["<=", 7], "max": 230},
    {"n": "TEC 1", "m": [">=", 95], "max": 160},
    {"n": "NR35", "m": [">=", 90], "max": 50},
    {"n": "Certidão atend.", "m": null, "max": 70},
    {"n": "T1", "m": null, "max": 35},
    {"n": "EPI/EPC", "m": null, "max": 25},
    {"n": "Fardamento", "m": null, "max": 25},
    {"n": "Pontualidade", "m": null, "max": 25}
  ],
  "t": [
    {"login": "Z367110", "nome": "ALEX DA SILVA", "v": [null, null, null, null, null, null, null, null, null]},
    {"login": "Z585518", "nome": "DAVID MAGDIEL", "v": [null, null, null, null, null, null, null, null, null]},
    {"login": "Z164141", "nome": "IZIDORO PEREIRA", "v": [null, null, null, null, null, null, null, null, null]},
    {"login": "Z450037", "nome": "JOSE FRANCISCO", "v": [null, null, null, null, null, null, null, null, null]},
    {"login": "Z693911", "nome": "MATHEUS HENRIQUE", "v": [null, null, null, null, null, null, null, null, null]},
    {"login": "Z702745", "nome": "ABDIELSON PACHECO", "v": [null, null, null, null, null, null, null, null, null]},
    {"login": "Z132322", "nome": "KLEYTON APOLINARIO", "v": [null, null, null, null, null, null, null, null, null]},
    {"login": "Z445950", "nome": "MATEUS LIMA", "v": [null, null, null, null, null, null, null, null, null]}
  ]
};
const K1='premiacao_out2026_valores_v4',K2='premiacao_out2026_manual_v4',K3='premiacao_out2026_metas_v4',K4='premiacao_out2026_dias_v4',K5='premiacao_out2026_base_v4';
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:1});
let P=D.ind.map(i=>i.max),M={},V={},DAYS={},BASE=30;
try{const s=JSON.parse(localStorage.getItem(K1)||'null');if(Array.isArray(s)&&s.length===P.length)P=s.map(x=>+x||0)}catch(e){}
try{const s=JSON.parse(localStorage.getItem(K2)||'null');if(s&&typeof s==='object')M=s}catch(e){}
try{const s=JSON.parse(localStorage.getItem(K3)||'null');if(s&&typeof s==='object')V=s}catch(e){}
try{const s=JSON.parse(localStorage.getItem(K4)||'null');if(s&&typeof s==='object')DAYS=s}catch(e){}
try{const s=JSON.parse(localStorage.getItem(K5)||'null');if(s&&+s>0)BASE=+s}catch(e){}

document.getElementById('base-days').value=BASE;

const save=()=>{
  try{
    localStorage.setItem(K1,JSON.stringify(P));
    localStorage.setItem(K2,JSON.stringify(M));
    localStorage.setItem(K3,JSON.stringify(V));
    localStorage.setItem(K4,JSON.stringify(DAYS));
    localStorage.setItem(K5,JSON.stringify(BASE));
  }catch(e){}
};
const hit=(v,m)=>v!=null&&(m[0]==='>='?v>=m[1]:v<=m[1]);
const getVal=(x,k)=>{
  if(V[x.login]&&V[x.login][k]!==undefined)return V[x.login][k];
  return x.v[k];
};
const getDays=(x)=>{
  const d=DAYS[x.login];
  return (d!==undefined&&d!==null&&d!=='')?+d:BASE;
};

function build(){
 let h='<thead><tr><th class="nm">Técnico</th>'+D.ind.map(i=>`<th>${i.n}</th>`).join('')+'<th>Valor Base</th><th class="prop-col">Dias Trab.</th><th class="last">Total Proporcional</th></tr>';
 h+='<tr><th class="nm">Critério</th>'+D.ind.map(i=>`<th>${i.m?(i.m[0]==='>='?'≥ ':'≤ ')+fmt(i.m[1])+'%':'clique'}</th>`).join('')+'<th>100%</th><th class="prop-col" id="lbl-base">de '+BASE+' dias</th><th class="last">líquido a pagar</th></tr>';
 h+='<tr><th class="nm">Pontuação máx. (R$)</th>'+D.ind.map((i,k)=>`<th><input class="pv" type="number" min="0" step="0.01" inputmode="decimal" data-k="${k}" value="${P[k]}" aria-label="Valor de ${i.n}"></th>`).join('')+'<th id="mx"></th><th class="prop-col">proporção</th><th class="last" id="mx-prop"></th></tr></thead>';
 h+='<tbody>'+D.t.map((x,r)=>{
   const d=getDays(x);
   return `<tr data-r="${r}" data-s="${(x.nome+' '+x.login).toLowerCase()}"><td class="nm">${x.nome}<small>${x.login}</small></td>`+D.ind.map((i,k)=>{
     if(!i.m) return `<td data-k="${k}" class="mn" tabindex="0"></td>`;
     const val=getVal(x,k);
     return `<td data-k="${k}"><input class="mv" type="number" step="0.1" inputmode="decimal" placeholder="—" data-r="${r}" data-k="${k}" value="${val!=null?val:''}" aria-label="${i.n} de ${x.nome}"></td>`;
   }).join('')+`<td class="sub-tot" data-sub="${r}">R$ 0,00</td><td class="prop-col"><input class="dv" type="number" min="0" max="31" step="0.5" inputmode="decimal" data-r="${r}" value="${d}" aria-label="Dias trabalhados de ${x.nome}"><span class="pct-badge" data-pct="${r}">100%</span></td><td class="last"></td></tr>`;
 }).join('')+'</tbody>';
 h+='<tfoot><tr><td class="nm">Total por critério</td>'+D.ind.map(()=>'<td></td>').join('')+'<td id="ft-base"></td><td class="prop-col" id="ft-days"></td><td class="last" id="ft"></td></tr></tfoot>';
 document.getElementById('tb').innerHTML=h;
}

function calc(){
 let gBase=0,gProp=0,totDays=0;
 const col=D.ind.map(()=>0);
 document.getElementById('lbl-base').textContent='de '+BASE+' dias';
 document.querySelectorAll('#tb tbody tr').forEach(tr=>{
  const r=+tr.dataset.r,x=D.t[r];
  let s=0;
  D.ind.forEach((i,k)=>{
   const c=tr.children[k+1];let ok=false;
   if(!i.m){
    ok=!!(M[x.login]||[])[k];
    c.className='mn '+(ok?'ok':'off');
    c.textContent=ok?'✓ atingiu':'—';
   }else{
    const v=getVal(x,k);
    if(v==null||v===''||isNaN(v)){c.className='na';}
    else{ok=hit(+v,i.m);c.className=ok?'ok':'no';}
   }
   if(ok){s+=P[k];col[k]+=P[k]}
  });
  const d=Math.max(0,getDays(x));
  const ratio=BASE>0?Math.min(1,d/BASE):0;
  const sProp=s*ratio;
  tr.querySelector(`[data-sub="${r}"]`).textContent=brl(s);
  tr.querySelector(`[data-pct="${r}"]`).textContent=Math.round(ratio*100)+'%';
  tr.lastElementChild.textContent=brl(sProp);
  gBase+=s;
  gProp+=sProp;
  totDays+=d;
 });
 const f=document.querySelectorAll('#tb tfoot td');
 col.forEach((v,k)=>f[k+1].textContent=brl(v));
 document.getElementById('ft-base').textContent=brl(gBase);
 document.getElementById('ft-days').textContent=fmt(totDays)+' d';
 document.getElementById('ft').textContent=brl(gProp);
 document.getElementById('gt').textContent=brl(gProp);
 const maxVal=brl(P.reduce((a,b)=>a+b,0));
 document.getElementById('mx').textContent=maxVal;
 document.getElementById('mx-prop').textContent='máx. '+maxVal;
}

function tog(td){
 if(!td||!td.classList.contains('mn'))return;
 const x=D.t[+td.parentElement.dataset.r],k=+td.dataset.k;
 const a=M[x.login]=M[x.login]||[];a[k]=!a[k];save();calc();
}

build();calc();

const tb=document.getElementById('tb');
tb.addEventListener('input',e=>{
 if(e.target.classList.contains('pv')){
  P[+e.target.dataset.k]=Math.max(0,parseFloat(e.target.value)||0);save();calc();
 }else if(e.target.classList.contains('mv')){
  const x=D.t[+e.target.dataset.r],k=+e.target.dataset.k;
  const raw=e.target.value.trim();
  V[x.login]=V[x.login]||{};
  V[x.login][k]=raw===''?null:parseFloat(raw);
  save();calc();
 }else if(e.target.classList.contains('dv')){
  const x=D.t[+e.target.dataset.r];
  const raw=e.target.value.trim();
  DAYS[x.login]=raw===''?0:Math.max(0,parseFloat(raw)||0);
  save();calc();
 }
});

document.getElementById('base-days').addEventListener('input',e=>{
 const v=Math.max(1,parseInt(e.target.value,10)||30);
 const oldBase=BASE;
 BASE=v;
 D.t.forEach((x,r)=>{
  if(DAYS[x.login]===undefined||DAYS[x.login]===oldBase){
   DAYS[x.login]=BASE;
   const inp=document.querySelector(`.dv[data-r="${r}"]`);
   if(inp)inp.value=BASE;
  }
 });
 save();calc();
});

tb.addEventListener('click',e=>tog(e.target.closest('td')));
tb.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('mn')){e.preventDefault();tog(e.target)}});

document.getElementById('q').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase().trim();
 document.querySelectorAll('#tb tbody tr').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none');
});

document.getElementById('all-ok').onclick=()=>{
 D.t.forEach(x=>{
  M[x.login]=M[x.login]||[];
  D.ind.forEach((i,k)=>{if(!i.m)M[x.login][k]=true});
 });
 save();calc();
};

document.getElementById('clr').onclick=()=>{
 P=D.ind.map(i=>i.max);M={};V={};DAYS={};BASE=30;
 document.getElementById('base-days').value=BASE;
 save();build();calc();
};

document.getElementById('thm').onclick=()=>{
 const d=document.documentElement,dark=d.dataset.theme==='dark'||(d.dataset.theme!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);
 d.dataset.theme=dark?'light':'dark';
};

document.getElementById('shot').onclick=async()=>{
 const btn=document.getElementById('shot');
 const orig=btn.textContent;
 btn.textContent='⏳ Gerando foto...';
 btn.disabled=true;
 const area=document.getElementById('capture-area');
 document.body.classList.add('capturing');
 try{
  await new Promise(r=>setTimeout(r,100));
  const canvas=await html2canvas(area,{
   scale:2,
   backgroundColor:getComputedStyle(document.body).backgroundColor,
   useCORS:true,
   logging:false,
   windowWidth:area.scrollWidth+40
  });
  const a=document.createElement('a');
  a.download='Premiacao_Manutencao_Outubro_2026.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
 }catch(err){
  alert('Erro ao gerar imagem. Tente usar a impressão do navegador.');
 }finally{
  document.body.classList.remove('capturing');
  btn.textContent=orig;
  btn.disabled=false;
 }
};
</script>
</body>
</html>
